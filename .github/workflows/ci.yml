name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Checar tamanho do CLAUDE.md (guard ADR-006 — ver CLAUDE.md § Documentação em camadas)
        run: pnpm check:claude-md

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes unitários
        run: pnpm test:unit

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências do servidor local (docs/14-plataforma-local.md §3)
        run: python -m pip install -r server/requirements.txt pytest httpx

      - name: Testes do servidor local
        run: python -m pytest server/tests

      - name: Build
        run: pnpm build

      - name: Verificar auto-contenção
        run: pnpm check-selfcontained

      - name: Instalar Chromium do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Testes E2E
        run: pnpm test:e2e

      - name: Publicar relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
