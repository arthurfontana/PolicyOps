<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PolicyOps</title>
    <!-- Favicon próprio, SVG inline — sem arquivo externo (docs/02 §2, zero requisições de rede). -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f172a'/%3E%3Crect x='4' y='4' width='10' height='10' rx='2' fill='%2316a34a'/%3E%3Crect x='18' y='4' width='10' height='10' rx='2' fill='%23f59e0b'/%3E%3Crect x='4' y='18' width='10' height='10' rx='2' fill='%233b82f6'/%3E%3Crect x='18' y='18' width='10' height='10' rx='2' fill='%23dc2626'/%3E%3C/svg%3E"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('policyops.theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* localStorage indisponível; mantém tema claro padrão */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
